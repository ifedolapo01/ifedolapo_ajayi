    <!-- Applied before first paint so the chosen stock never flashes. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("teardown-stock");
          var dark =
            stored === "ink" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
